name: Build AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            python3-venv python3-tk libpython3-dev libpulse0 zsync file \
            desktop-file-utils binutils

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-build.txt

      - name: Check the source package
        run: |
          . .venv/bin/activate
          python -m compileall -q src
          PYTHONPATH=src python -m livecaption --version

      - name: Build
        run: |
          . .venv/bin/activate
          export PYTHON="$PWD/.venv/bin/python"
          export VERSION="0.0.0-${GITHUB_SHA::7}"
          packaging/build-appimage.sh

      - name: Smoke test
        run: |
          packaging/smoke-test.sh dist/LiveCaption-*.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaption-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.zsync
          if-no-files-found: error
