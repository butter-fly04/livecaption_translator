name: Build AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            suffix: ubuntu22.04
          - os: ubuntu-24.04
            suffix: ubuntu24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            python3-venv python3-tk libpython3-dev libpulse0 zsync file \
            curl ca-certificates desktop-file-utils binutils

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-build.txt

      - name: Check the source package
        run: |
          . .venv/bin/activate
          python -m compileall -q src
          PYTHONPATH=src python -m livecaption --version

      - name: Build
        run: |
          . .venv/bin/activate
          export PYTHON="$PWD/.venv/bin/python"
          export VERSION="0.0.0-${GITHUB_SHA::7}"
          export SUFFIX="${{ matrix.suffix }}"
          packaging/build-appimage.sh

      - name: Smoke test
        run: |
          packaging/smoke-test.sh dist/LiveCaption-*-${{ matrix.suffix }}-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaption-${{ matrix.suffix }}
          path: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.zsync
          if-no-files-found: error

  fedora:
    name: Fedora (container)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build and smoke-test in a Fedora container
        run: |
          CONTAINER=docker \
          IMAGE=live-caption-build:fedora \
          DOCKERFILE=Dockerfile.fedora \
          SUFFIX=fedora \
          SMOKE_TEST=1 \
          VERSION="0.0.0-${GITHUB_SHA::7}" \
          packaging/build-in-container.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaption-fedora
          path: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.zsync
          if-no-files-found: error
